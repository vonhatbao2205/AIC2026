# Local build of the console, for the person maintaining it.
#
#   set -a; source ../frontend/.env.local; set +a
#   docker compose -f docker/compose.dev.yml up -d --build
#
# The team never sees this file: their bundle ships a prebuilt image and its own
# compose file, generated by build-bundle.sh.
name: aic26

services:
  console:
    image: aic26-console:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Vite inlines these at build time; see the note in docker/Dockerfile.
        VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:-}"
        VITE_SUPABASE_PUBLISHABLE_KEY: "${VITE_SUPABASE_PUBLISHABLE_KEY:-}"
        VITE_SUBMISSION_ROOM: "${VITE_SUBMISSION_ROOM:-aic26}"
    container_name: aic26-console
    # Loopback only. This app can rewrite its own credentials through
    # /api/config, so exposing it to the LAN would hand that to anyone on the
    # network. To share it with a teammate, change to "8000:8000" deliberately.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The imported .env lives here, so it survives replacing the image.
      - ../config:/config
      # Submit history — the local record of what was sent to DRES.
      - ../data:/data
    user: "${AIC26_UID:-1000}:${AIC26_GID:-1000}"
    restart: unless-stopped
